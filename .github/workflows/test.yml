name: 🧪 Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Phishing sig generator
        run: python3 scripts/gsm/phishing_sig_generator.py --generate

      - name: Unit tests
        run: python3 -m unittest tests/test_eip712_analyzer.py -v

      - name: Permit simulation
        run: python3 scripts/gsm/permit_sim.py

      - name: EIP-712 detector demo
        run: python3 scripts/gsm/eip712_detector.py --simulate

      - name: Mempool watcher demo
        run: python3 scripts/gsm/mempool_permit_watcher.py --demo

  docker:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

